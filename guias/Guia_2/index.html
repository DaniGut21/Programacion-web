<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Pizzas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Elementos flotantes innovadores -->
    <span class="floating-ingredient tomato" style="left: 10%; top: 15%;">🍅</span>
    <span class="floating-ingredient cheese" style="right: 15%; top: 25%;">🧀</span>
    <span class="floating-ingredient ham" style="left: 20%; bottom: 20%;">🍖</span>
    <span class="floating-ingredient basil" style="right: 10%; bottom: 30%;">🌿</span>
    <span class="floating-ingredient tomato" style="left: 5%; bottom: 10%;">🍅</span>
    <span class="floating-ingredient cheese" style="right: 5%; top: 50%;">🧀</span>

    <div class="contenedor">
        <h1>Pedido de Pizzas Online</h1>

        <form action="#" method="post" class="formulario-pedido">

            <!-- Datos del cliente -->
            <fieldset>
                <legend>Datos Personales</legend>
                
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Calle, número, barrio" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
                </div>
            </fieldset>

            <!-- Pizzas con imágenes -->
            <fieldset>
                <legend>Selecciona tus pizzas</legend>

                <div class="pizza-opcion">
                    <img src="https://thumbs.dreamstime.com/b/closeup-photo-ham-cheese-pizza-closeup-photo-homemade-fresh-ham-cheese-pizza-158535028.jpg" alt="Jamón y Queso" class="pizza-img">
                    <input type="checkbox" id="jamon-queso" name="pizzas" value="Jamon y Queso">
                    <label for="jamon-queso">Jamón y Queso</label>
                    <input type="number" name="cantidad_jamon_queso" min="0" max="20" value="0" class="cantidad">
                    <span class="etiqueta-cantidad">cantidad</span>
                    <div class="tooltip">Pizza con jamón fresco y queso derretido. ¡Deliciosa!</div>
                </div>

                <div class="pizza-opcion">
                    <img src="https://news.italianfood.net/wp-content/uploads/sites/2/2020/01/pizza-napoletana.jpg" alt="Napolitana" class="pizza-img">
                    <input type="checkbox" id="napolitana" name="pizzas" value="Napolitana">
                    <label for="napolitana">Napolitana</label>
                    <input type="number" name="cantidad_napolitana" min="0" max="20" value="0" class="cantidad">
                    <span class="etiqueta-cantidad">cantidad</span>
                    <div class="tooltip">Clásica con tomate, ajo y orégano. ¡Auténtica italiana!</div>
                </div>

                <div class="pizza-opcion">
                    <img src="https://www.shutterstock.com/shutterstock/photos/2686512803/display_1500/stock-photo-mozzarella-pizza-served-on-wooden-restaurant-table-close-up-2686512803.jpg" alt="Muzzarella" class="pizza-img">
                    <input type="checkbox" id="muzzarella" name="pizzas" value="Muzzarella">
                    <label for="muzzarella">Muzzarella</label>
                    <input type="number" name="cantidad_muzzarella" min="0" max="20" value="0" class="cantidad">
                    <span class="etiqueta-cantidad">cantidad</span>
                    <div class="tooltip">Queso mozzarella fresco y salsa. ¡Simple y perfecta!</div>
                </div>
            </fieldset>

            <!-- Detalles adicionales -->
            <fieldset>
                <legend>Detalles del pedido</legend>
                <textarea name="detalles" id="detalles" rows="5" placeholder="Ingredientes extras, sin algo, horario preferido, etc..."></textarea>
            </fieldset>

            <!-- Botón de envío con animación -->
            <div class="boton-contenedor">
                <button type="submit">Enviar Pedido</button>
            </div>

        </form>
    </div>

</body>
</html>
