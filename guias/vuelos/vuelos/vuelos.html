<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Vuelo - Seleccion de Vuelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page page-flights">
    <section class="header-card">
      <h1>Vuelos Disponibles</h1>
      <p id="passengerPreview" class="subtitle"></p>
    </section>

    <section class="flights-grid" id="flightsGrid"></section>
  </main>

  <div class="modal" id="bookingModal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" id="closeModal" aria-label="Cerrar">&times;</button>
      <h2 id="bookingTitle">Reserva realizada</h2>
      <div id="bookingSummary" class="summary"></div>
      <a href="index.html" class="btn-back-index">Volver al inicio</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
